name: NAND integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unmodified-script-on-nandsim:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated virtual machine tools
        run: sudo apt-get update && sudo apt-get install -y busybox-static qemu-system-x86 cpio kmod
      - name: Build a disposable VM with a Debian kernel and NAND modules
        run: sudo python3 tests/build_nand_vm.py
      - name: Exercise unchanged client script through guest Linux MTD
        run: sudo python3 tests/run_nand_vm.py
