name: Script checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shell-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install -y busybox shellcheck
      - name: Check shell syntax
        run: sh -n beryl-region.sh && busybox ash -n beryl-region.sh
      - name: ShellCheck
        run: shellcheck -s sh beryl-region.sh
      - name: Test with dash
        run: python3 -m unittest discover -s tests -v
      - name: Test with BusyBox ash
        env:
          TEST_SHELL: busybox ash
        run: python3 -m unittest discover -s tests -v
